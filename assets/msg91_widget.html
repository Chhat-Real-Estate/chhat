<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script type="text/javascript">
  var configuration = {
    widgetId: "366861654330313930303134",
    tokenAuth: "556089TAWsOacej6a6da019P1",
    exposeMethods: true,
    success: (data) => {},
    failure: (error) => {},
  };

  function callSendOtp(identifier) {
    window.sendOtp(identifier,
      (data) => FlutterChannel.postMessage(JSON.stringify({event: "sendSuccess", data: data})),
      (error) => FlutterChannel.postMessage(JSON.stringify({event: "sendFailure", error: JSON.stringify(error)}))
    );
  }

  function callVerifyOtp(otp) {
    window.verifyOtp(otp,
      (data) => FlutterChannel.postMessage(JSON.stringify({event: "verifySuccess", data: data})),
      (error) => FlutterChannel.postMessage(JSON.stringify({event: "verifyFailure", error: JSON.stringify(error)}))
    );
  }
</script>
<script type="text/javascript">
(function loadOtpScript(urls) {
  let i = 0;
  function attempt() {
    const s = document.createElement('script');
    s.src = urls[i];
    s.async = true;
    s.onload = () => {
      if (typeof window.initSendOTP === 'function') {
        window.initSendOTP(configuration);
        FlutterChannel.postMessage(JSON.stringify({event: "ready"}));
      }
    };
    s.onerror = () => {
      i++;
      if (i < urls.length) attempt();
    };
    document.head.appendChild(s);
  }
  attempt();
})([
  'https://verify.msg91.com/otp-provider.js',
  'https://verify.phone91.com/otp-provider.js'
]);
</script>
</body>
</html>
